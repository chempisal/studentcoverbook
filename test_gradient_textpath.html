<!DOCTYPE html>
<html>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff0000" />
      <stop offset="100%" stop-color="#0000ff" />
    </linearGradient>
    <path id="p1" d="M 50,150 Q 300,50 550,150" fill="none" stroke="none" />
  </defs>

  <!-- text with textPath and gradient fill -->
  <text font-size="40" font-weight="bold" fill="url(#g1)">
    <textPath href="#p1" startOffset="50%" text-anchor="middle">HELLO GRADIENT TEXTPATH</textPath>
  </text>

  <!-- standard text with gradient fill -->
  <text x="300" y="250" font-size="40" font-weight="bold" fill="url(#g1)" text-anchor="middle">HELLO STRAIGHT GRADIENT</text>

  <!-- standard text with solid fill -->
  <text x="300" y="320" font-size="40" font-weight="bold" fill="#0d47a1" text-anchor="middle">HELLO SOLID FILL</text>
</svg>
</body>
</html>
